[project]
name = "nacos-client"
version = "0.1.0"
description = "Lightweight Nacos config client shared across digital-employee backends."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nacos-sdk-python<2",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nacos_client"]
