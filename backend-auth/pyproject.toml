[project]
name = "backend-auth"
version = "0.1.0"
description = "Digital Employee Identity Center: 用户登录、双 token 鉴权、RBAC 权限、菜单与 Bot 权限管理"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.140.7",
    "uvicorn[standard]==0.51.0",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.2",
    "loguru==0.7.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "passlib[bcrypt]==1.7.4",
    "email-validator==2.3.0",
    "phonenumbers==9.0.25",
    "nacos-client==0.1.0",
    "api-common==0.1.0",
    "auth-utils==0.1.0",
    "data-client==0.1.0",
    "observability==0.1.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "ruff==0.6.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
nacos-client = { path = "../backend-share/nacos-client", editable = true }
api-common = { path = "../backend-share/api-common", editable = true }
auth-utils = { path = "../backend-share/auth-utils", editable = true }
data-client = { path = "../backend-share/data-client", editable = true }
observability = { path = "../backend-share/observability", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 中文文档中全角标点（，。：；（）等）为正常用法，不强制改为半角。
# E501 由 line-length 控制；保留 ruff 行宽软警告以保持可读性。
ignore = [
    "E501",
    "B008",   # FastAPI 推荐在默认参数中使用 Depends()，与项目惯例一致
    "RUF001",  # 字符串中的中文全角标点
    "RUF002",  # docstring 中的中文全角标点
    "RUF003",  # 注释中的中文全角标点
    "RUF006",  # 字典字面量中的中文全角标点
]
