[project]
name = "backend-auth"
version = "0.1.0"
description = "Digital Employee Identity Center: 用户登录、双 token 鉴权、RBAC 权限、菜单与 Bot 权限管理"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0,<6.0",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1",
    "passlib[bcrypt]>=1.7,<2.0",
    "nacos-client",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[tool.uv.sources]
nacos-client = { path = "../backend-share/nacos-client" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 中文文档中全角标点（，。：；（）等）为正常用法，不强制改为半角。
# E501 由 line-length 控制；保留 ruff 行宽软警告以保持可读性。
ignore = [
    "E501",
    "B008",   # FastAPI 推荐在默认参数中使用 Depends()，与项目惯例一致
    "RUF002",  # docstring 中的中文全角标点
    "RUF003",  # 注释中的中文全角标点
    "RUF006",  # 字典字面量中的中文全角标点
]
