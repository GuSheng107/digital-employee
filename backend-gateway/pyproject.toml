[project]
name = "backend-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "api-common==0.1.0",
    "auth-utils==0.1.0",
    "data-client==0.1.0",
    "fastapi==0.140.7",
    "lark-oapi==1.4.8",
    "loguru==0.7.3",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "uvicorn[standard]==0.51.0",
    "wecom-aibot-sdk==1.0.8",
    "nacos-client==0.1.0",
    "observability==0.1.0",
]

[tool.uv.sources]
nacos-client = { path = "../backend-share/nacos-client", editable = true }
api-common = { path = "../backend-share/api-common", editable = true }
auth-utils = { path = "../backend-share/auth-utils", editable = true }
data-client = { path = "../backend-share/data-client", editable = true }
observability = { path = "../backend-share/observability", editable = true }

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "ruff==0.6.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 中文文档中全角标点（，。：；（）等）为正常用法，不强制改为半角。
# E501 由 line-length 控制；保留 ruff 行宽软警告以保持可读性。
ignore = [
    "E501",
    "B008",   # FastAPI 推荐在默认参数中使用 Depends()，与项目惯例一致
    "RUF001",  # 字符串中的中文全角标点
    "RUF002",  # docstring 中的中文全角标点
    "RUF003",  # 注释中的中文全角标点
    "RUF006",  # 字典字面量中的中文全角标点
]
