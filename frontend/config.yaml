database:
  path: data/ai_database.db
wecom_bot:
  websocket_url: wss://openws.work.weixin.qq.com
  reconnect_interval_ms: 1000
  heartbeat_interval_ms: 30000
logging:
  level: INFO
agent:
  context_length_limit: 10000
  summary_max_chars: 1800
  compression_transcript_max_chars: 12000
  provider: dfa20de2-1c91-4e60-8b17-3cb9bbfeab07
  timeout_seconds: 60
  max_iterations: 5
  reply_notice: --本回答由AI生成，请注意鉴别，必要时请@我说:"转人工"，我会帮您转接。
  fallback_text: 抱歉，我暂时无法回答您的问题，请稍后再试。
  max_output_chars: 1800
  truncation_notice: '[内容已截断]'
  max_cache_size: 10
  max_stream_chunks: 500
runtime:
  max_concurrent_requests: 20
  busy_reply_text: 当前业务繁忙，请稍候尝试
skills:
  max_zip_bytes: 10485760
  max_zip_entries: 200
