[project]
name = "backend-data"
version = "0.1.0"
description = "Digital Employee Data Platform Backend Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aio-pika==9.6.2",
    "fastapi==0.140.7",
    "uvicorn[standard]==0.51.0",
    "SQLAlchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "redis==5.3.1",
    "python-dotenv==1.2.2",
    "minio==7.2.15",
    "loguru==0.7.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "nacos-client==0.1.0",
    "api-common==0.1.0",
    "auth-utils==0.1.0",
    "observability==0.1.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "ruff==0.6.9",
]

[tool.uv.sources]
nacos-client = { path = "../../backend-share/nacos-client", editable = true }
api-common = { path = "../../backend-share/api-common", editable = true }
auth-utils = { path = "../../backend-share/auth-utils", editable = true }
observability = { path = "../../backend-share/observability", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
