[project]
name = "backend-data"
version = "0.1.0"
description = "Digital Employee Data Platform Backend Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0,<6.0",
    "python-dotenv>=1.0",
    "minio>=7.2",
    "loguru>=0.7",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1",
    "nacos-client",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
]

[tool.uv.sources]
nacos-client = { path = "../../backend-share/nacos-client" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
