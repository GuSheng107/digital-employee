[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wecom-bot-agent"
version = "0.1.0"
description = "Minimal WeCom bot long-connection starter aligned to the engineering doc."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "certifi>=2023.7.22",
  "cryptography>=41.0.0",
  "dashscope>=1.25.0",
  "fastapi>=0.115.0",
  "httpx>=0.24.0",
  "langchain~=1.2.0",
  "langchain-anthropic~=1.4.0",
  "langchain-community~=0.4.0",
  "langchain-core~=1.3.0",
  "langchain-experimental~=0.4.0",
  "langchain-google-genai~=4.2.0",
  "langchain-mcp-adapters~=0.2.0",
  "langchain-openai~=1.2.0",
  "markdown>=3.4",
  "olefile>=0.46",
  "openai>=1.0.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30.0",
  "wecom-aibot-sdk>=1.0.6",
  "nacos-client",
]

[tool.uv.sources]
nacos-client = { path = "../shared/nacos-client" }

[tool.setuptools.packages.find]
include = ["agent_runtime*", "app*", "wecom_bot*"]
