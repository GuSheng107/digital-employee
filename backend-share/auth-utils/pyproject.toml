[project]
name = "auth-utils"
version = "0.1.0"
description = "Shared backend-auth authorization and user-context HTTP client."
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_utils"]
