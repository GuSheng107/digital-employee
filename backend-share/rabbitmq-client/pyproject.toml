[project]
name = "rabbitmq-client"
version = "0.1.0"
description = "Native AMQP RabbitMQ async client shared across digital-employee backends."
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=9.4.0",
    "loguru>=0.7.2",
    "observability==0.1.0",
]

[tool.uv.sources]
observability = { path = "../observability", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rabbitmq_client"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
