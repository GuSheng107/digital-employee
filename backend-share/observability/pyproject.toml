[project]
name = "observability"
version = "0.1.0"
description = "Shared distributed trace contracts and FastAPI middleware."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
    "starlette>=1.3.1,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observability"]
