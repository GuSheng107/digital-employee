[project]
name = "secret-crypto"
version = "0.1.0"
description = "Reversible app_secret encryption shared across digital-employee backends."
requires-python = ">=3.11"
dependencies = [
    "cryptography==49.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secret_crypto"]

[dependency-groups]
dev = [
    "pytest==7.4.4",
    "ruff==0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF006",
]

[tool.pytest.ini_options]
pythonpath = ["."]
