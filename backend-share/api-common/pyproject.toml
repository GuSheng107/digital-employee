[project]
name = "api-common"
version = "0.1.0"
description = "Shared API response models and helpers for digital-employee backends."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_common"]
