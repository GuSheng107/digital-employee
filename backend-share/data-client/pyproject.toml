[project]
name = "data-client"
version = "0.1.0"
description = "HTTP client for backend-data service (Minio upload, etc.) shared across digital-employee backends."
requires-python = ">=3.11"
dependencies = [
    "api-common==0.1.0",
    "httpx==0.28.1",
    "observability==0.1.0",
]

[tool.uv.sources]
api-common = { path = "../api-common", editable = true }
observability = { path = "../observability", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_client"]
